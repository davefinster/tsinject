# Normally the operator creates TailscaleCredentials on demand from pod
# annotations — authoring one by hand is only needed to pre-provision, to
# pin custom tags/secret names, or to share one identity across workloads
# (pods bind to it via tailscale-shared-name: web).
#
# Deleting a TailscaleCredential revokes its OAuth client in the tailnet
# (finalizer) and garbage-collects the delivered Secret. Credentials created
# on demand for a Deployment carry an ownerReference to it, so deleting the
# Deployment cleans up the whole chain.
apiVersion: tsinject.dmf.zone/v1alpha1
kind: TailscaleCredential
metadata:
  name: web
spec:
  tags:                       # tag:injected is always added
    - tag:web
  ephemeral: true             # ?ephemeral=true on the delivered secret
  # tailnet: global-infrastructure  # operator-configured tailnet; default when omitted
  # secretName: web-ts-credential   # default "<name>-ts-credential"
  # description: web frontend       # OAuth client label in the admin console
