---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tailscalecredentials.tsinject.dmf.zone
spec:
  group: tsinject.dmf.zone
  names:
    kind: TailscaleCredential
    listKind: TailscaleCredentialList
    plural: tailscalecredentials
    shortNames:
    - tscred
    singular: tailscalecredential
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.secretName
      name: Secret
      type: string
    - jsonPath: .status.oauthClientID
      name: ClientID
      type: string
    - jsonPath: .status.tailnet
      name: Tailnet
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TailscaleCredential provisions a Tailscale OAuth client for one
          workload identity, delivered as a Secret consumable by the injected
          sidecar. Normally created on demand by the pod gate controller from
          pod annotations; may also be authored directly.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TailscaleCredentialSpec declares a Tailscale OAuth client scoped to
              a workload identity. The operator materializes it: an OAuth client
              minted via the Tailscale API, delivered as a Secret in this
              namespace in the shape the injected sidecar expects
              (oauth.id / oauth.secret).
            properties:
              description:
                description: |-
                  Description labels the OAuth client in the Tailscale admin
                  console. Defaults to the object name.
                type: string
              ephemeral:
                description: |-
                  Ephemeral appends ?ephemeral=<value> to the delivered OAuth
                  secret so nodes register (non-)ephemeral explicitly. Unset
                  leaves the tailscaled default.
                type: boolean
              secretName:
                description: |-
                  SecretName is the name of the Secret created in this namespace.
                  Defaults to "<name>-ts-credential", which is what the webhook
                  mounts.
                type: string
              tags:
                description: |-
                  Tags are the full Tailscale ACL tags ("tag:...") the OAuth
                  client may assign. tag:injected is always included; defaults to
                  exactly that.
                items:
                  type: string
                type: array
              tailnet:
                description: |-
                  Tailnet names the operator-configured tailnet the OAuth client
                  is minted in. Empty selects the operator's nominated default
                  (and stays pinned to whatever status records, so re-nominating
                  the default never re-homes existing clients). Changing it
                  revokes the client and mints a replacement in the new tailnet.
                type: string
            type: object
          status:
            description: |-
              TailscaleCredentialStatus is the operator's view of how far
              provisioning has converged.
            properties:
              conditions:
                description: |-
                  Conditions — the standard Ready condition carries the state
                  machine: ProvisioningFailed while the Tailscale API call
                  errors, Provisioned (or Adopted) once the namespace Secret is
                  in place.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              oauthClientID:
                description: |-
                  OAuthClientID is the Tailscale key ID of the minted OAuth
                  client — what the finalizer revokes on deletion.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation last acted
                  upon.
                format: int64
                type: integer
              provisionedTags:
                description: |-
                  ProvisionedTags are the tags the OAuth client currently
                  carries; drift against spec.tags triggers an in-place update.
                items:
                  type: string
                type: array
              secretName:
                description: SecretName is the resolved name of the delivered Secret.
                type: string
              tailnet:
                description: |-
                  Tailnet is the configured tailnet the OAuth client was
                  provisioned in — where revocations (finalizer, re-mints) are
                  sent. Empty on credentials provisioned before multi-tailnet
                  support; treated as the default.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
