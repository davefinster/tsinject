{{- if and .Values.webhook.enabled .Values.webhook.createCertSecret }}
# Placeholder the operator's cert rotator populates and rotates.
# cert-controller UPDATES this Secret but never creates it (same pattern as
# Gatekeeper, which also ships an empty placeholder) — though the operator
# also self-creates it at startup when absent. No data on purpose: Helm's
# three-way merge never claims the data field, so the rotator-written
# certificate survives upgrades untouched.
apiVersion: v1
kind: Secret
metadata:
  name: tsinject-webhook-cert # fixed name: matches the operator constant
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tsinject.labels" . | nindent 4 }}
    # Selected by the operator's scoped Secret informer; deliberately NOT a
    # templated label so helm upgrades cannot drop it.
    tsinject.dmf.zone/watched: "true"
{{- end }}
