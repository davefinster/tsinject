{{- if not .Values.tailscale.oauth.existingSecret }}
{{- if .Values.tailscale.tailnets }}
# The operator's tailnet credentials in the multi-tailnet secret.json shape:
# one admin OAuth client per configured tailnet, one nominated the default.
# Prefer tailscale.oauth.existingSecret in setups where values files must
# stay secret-free.
{{- $tailnets := dict }}
{{- range $name, $entry := .Values.tailscale.tailnets }}
{{- $e := dict "tailnet" ($entry.tailnet | default "-") }}
{{- if $entry.clientId }}
{{- $_ := set $e "client_id" $entry.clientId }}
{{- $_ := set $e "client_secret" $entry.clientSecret }}
{{- end }}
{{- if $entry.credentialMode }}
{{- $_ := set $e "credential_mode" $entry.credentialMode }}
{{- end }}
{{- $_ := set $tailnets $name $e }}
{{- end }}
{{- $file := dict "tailnets" $tailnets }}
{{- if .Values.tailscale.defaultTailnet }}
{{- $_ := set $file "default" .Values.tailscale.defaultTailnet }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tsinject.oauthSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tsinject.labels" . | nindent 4 }}
stringData:
  secret.json: {{ $file | toJson | quote }}
{{- else if and .Values.tailscale.oauth.clientId .Values.tailscale.oauth.clientSecret }}
# The operator's own Tailscale OAuth client, in the secret.json file format
# the binary consumes. Prefer tailscale.oauth.existingSecret in setups where
# values files must stay secret-free.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tsinject.oauthSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tsinject.labels" . | nindent 4 }}
stringData:
  secret.json: {{ dict "client_id" .Values.tailscale.oauth.clientId "client_secret" .Values.tailscale.oauth.clientSecret | toJson | quote }}
{{- end }}
{{- end }}
